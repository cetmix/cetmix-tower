<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#ffffff"/>

  <!-- Pending -->
  <rect x="30" y="60" width="200" height="76" rx="38" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="130" y="94" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">Pending</text>
  <text x="130" y="118" font-size="12" fill="#64748b" text-anchor="middle">slot reserved</text>

  <path d="M230 98H366" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="298" y="86" font-size="13" fill="#334155" text-anchor="middle">controller</text>
  <text x="298" y="120" font-size="13" fill="#334155" text-anchor="middle">accepted</text>

  <!-- Running -->
  <rect x="370" y="60" width="200" height="76" rx="38" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="470" y="94" font-size="18" font-weight="700" fill="#0369a1" text-anchor="middle">Running</text>
  <text x="470" y="118" font-size="12" fill="#0369a1" text-anchor="middle">heartbeats, polling</text>

  <!-- to finals -->
  <path d="M570 92C620 92 620 43 676 43" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M570 98H676" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M570 104C620 104 620 153 676 153" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="680" y="20" width="190" height="46" rx="23" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="775" y="49" font-size="17" font-weight="700" fill="#047857" text-anchor="middle">Done</text>
  <rect x="680" y="75" width="190" height="46" rx="23" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="775" y="104" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">Failed</text>
  <rect x="680" y="130" width="190" height="46" rx="23" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="775" y="159" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">Timed Out</text>

  <!-- callback note -->
  <path d="M870 98H926" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <rect x="930" y="40" width="250" height="116" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="950" y="72" font-size="15" font-weight="700" fill="#0f172a">Callback is called</text>
  <text x="950" y="96" font-size="13" fill="#334155">for every final outcome and</text>
  <text x="950" y="116" font-size="13" fill="#334155">must consume the result.</text>
  <text x="950" y="138" font-size="13" fill="#64748b">Timed out: result is None.</text>

  <!-- Cancelled -->
  <path d="M130 136V236H366" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <path d="M470 136V200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <rect x="370" y="204" width="200" height="64" rx="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="470" y="242" font-size="17" font-weight="700" fill="#64748b" text-anchor="middle">Cancelled</text>
  <text x="250" y="228" font-size="13" fill="#64748b" text-anchor="middle">Cancel</text>
  <text x="600" y="232" font-size="13" fill="#64748b">callback is not called,</text>
  <text x="600" y="252" font-size="13" fill="#64748b">controller is asked to stop the work</text>
</svg>
